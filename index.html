<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS // Access Core</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#04050d;--ink:#0a0d1e;--cyan:#22e4ff;--mag:#ff3df2;--grn:#3dffa8;--red:#ff4560;--txt:#d9f6ff;--dim:#6f84a8;--c:var(--cyan)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#14123a 0%,var(--void) 62%);color:var(--txt);font:500 14px/1.4 'Chakra Petch',system-ui,sans-serif;display:grid;place-items:center;padding:18px 12px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:auto -50% -10% -50%;height:60vh;background:linear-gradient(var(--c) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--c) 1px,transparent 1px) 0 0/48px 48px;opacity:.16;transform:perspective(380px) rotateX(62deg);animation:flow 4s linear infinite;mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%);pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
@keyframes flow{to{background-position:0 48px,48px 0}}
.panel{position:relative;width:min(100%,380px);padding:22px 20px 18px;background:linear-gradient(160deg,rgba(18,24,56,.82),rgba(7,9,24,.9));backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 60px color-mix(in srgb,var(--c) 22%,transparent),inset 0 0 40px rgba(0,0,0,.5);transition:box-shadow .5s,border-color .5s;animation:boot .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes boot{from{opacity:0;transform:scale(.94);filter:brightness(2.5) blur(3px)}}
.panel i{position:absolute;width:16px;height:16px;border:2px solid var(--c);transition:border-color .5s}
.panel i:nth-of-type(1){top:-2px;left:-2px;border-right:0;border-bottom:0}.panel i:nth-of-type(2){top:-2px;right:-2px;border-left:0;border-bottom:0}
.panel i:nth-of-type(3){bottom:-2px;left:-2px;border-right:0;border-top:0}.panel i:nth-of-type(4){bottom:-2px;right:-2px;border-left:0;border-top:0}
[data-s=open]{--c:var(--grn)}[data-s=lockout]{--c:var(--red)}[data-m=change]:not([data-s=lockout]){--c:var(--mag)}
.brand{display:flex;justify-content:space-between;font:700 11px Orbitron,sans-serif;letter-spacing:.3em;color:var(--dim)}
.brand b{color:var(--c);transition:color .5s}
.hud{position:relative;width:176px;height:176px;margin:8px auto 0}
.hud svg{width:100%;height:100%;overflow:visible}
.r1,.r2,.r3{fill:none;stroke:var(--c);transform-origin:100px 100px;transition:stroke .5s}
.r1{stroke-width:1.5;stroke-dasharray:3 9;animation:spin 18s linear infinite}
.r2{stroke-width:3;stroke-dasharray:70 120 30 60;animation:spin 7s linear infinite reverse;filter:drop-shadow(0 0 5px var(--c))}
.r3{stroke-width:1;opacity:.5}
[data-s=lockout] .r2{animation-duration:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.lk{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--c));transition:stroke .5s}
.lk .sh{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:100% 100%}
[data-s=open] .sh{transform:translateY(-9px) rotate(28deg)}
.st{text-align:center;margin-top:2px;font:900 24px Orbitron,sans-serif;letter-spacing:.14em;color:var(--c);text-shadow:0 0 18px var(--c);transition:color .5s}
.msg{text-align:center;min-height:20px;margin-top:2px;color:var(--txt)}
.msg.err{color:var(--red)}.msg.ok{color:var(--grn)}
.last{text-align:center;font-size:11px;color:var(--dim);letter-spacing:.06em}
.dots{display:flex;justify-content:center;gap:9px;margin:14px 0 4px}
.dots span{width:13px;height:13px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);transform:rotate(45deg);transition:.15s}
.dots span.on{background:var(--c);box-shadow:0 0 12px var(--c);transform:rotate(45deg) scale(1.15)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.steps{display:none;justify-content:center;gap:6px;margin:6px 0 0;font-size:11px;color:var(--dim)}
[data-m=change] .steps{display:flex}
.steps b{padding:1px 8px;border:1px solid var(--dim);font-weight:500}.steps b.on{color:var(--void);background:var(--c);border-color:var(--c)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.k{--cut:11px;position:relative;height:56px;border:0;color:var(--txt);font:600 22px Orbitron,sans-serif;cursor:pointer;background:color-mix(in srgb,var(--c) 70%,transparent);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:background .5s,transform .08s}
.k::before{content:"";position:absolute;inset:1px;background:linear-gradient(180deg,#141a3b,#0a0e25);clip-path:inherit;transition:background .15s}
.k span{position:relative}
.k:hover::before{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#141a3b),#0a0e25)}
.k:active,.k.hit{transform:scale(.93)}.k:active::before,.k.hit::before{background:color-mix(in srgb,var(--c) 45%,#0a0e25)}
.k.fn{font-size:13px;letter-spacing:.1em}
.k.go{background:var(--c)}.k.go::before{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#0a0e25),#0a0e25)}
.k:focus-visible,.a:focus-visible{outline:2px solid #fff;outline-offset:2px}
[data-s=lockout] .k,[data-busy="1"] .k{opacity:.4;pointer-events:none}
.bar{height:3px;margin-top:12px;background:rgba(255,255,255,.08);visibility:hidden}.bar div{height:100%;width:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
[data-s=open] .bar{visibility:visible}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.a{background:none;border:0;color:var(--dim);font:500 12px 'Chakra Petch',sans-serif;cursor:pointer;padding:6px 2px}.a:hover{color:var(--c)}
.feed{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(111,132,168,.35);font:400 11px/1.6 'Chakra Petch',monospace;color:var(--dim);min-height:68px}
.feed div.ok{color:var(--grn)}.feed div.er{color:var(--red)}.feed div.in{color:var(--cyan)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
.vid{position:absolute;left:50%;top:50%;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;object-fit:cover;transform:scaleX(-1);border:2px solid var(--c);opacity:0;transition:opacity .4s,border-color .5s;box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.lk{transition:stroke .5s,opacity .4s}
[data-cam="1"] .vid{opacity:1}
[data-cam="1"]:not([data-s=open]) .lk,[data-cam="1"][data-reg="1"] .lk{opacity:0}
[data-s=open]:not([data-reg="1"]) .vid{opacity:0}
[data-s=lockout] .vid{filter:grayscale(1) brightness(.5)}
.hud::after{content:"";position:absolute;left:34px;right:34px;top:36px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c);opacity:0;pointer-events:none}
[data-cam="1"][data-s=locked] .hud::after{opacity:.9;animation:sc 2.2s ease-in-out infinite}
@keyframes sc{50%{top:138px}}
.face{text-align:center;min-height:18px;font-size:12px;color:var(--c);letter-spacing:.04em}
#mng{margin-top:8px;padding-top:6px;border-top:1px dashed rgba(111,132,168,.35);font-size:12px}
#mng summary{cursor:pointer;color:var(--c)}
.mrow{display:flex;gap:6px;margin:8px 0}
.mrow input,.mrow select{background:#0a0e25;color:var(--txt);border:1px solid rgba(111,132,168,.5);padding:7px;font:inherit;min-width:0}.mrow input{flex:1}
.mrow input:focus,.mrow select:focus{outline:2px solid var(--c)}
#reg{width:100%;border:1px solid var(--c);color:var(--c);text-align:center}
#fl div{display:flex;justify-content:space-between;align-items:center;color:var(--dim)}
</style>
</head>
<body>
<main class="panel" id="p" data-s="locked" data-m="enter">
  <i></i><i></i><i></i><i></i>
  <div class="brand"><span>AEGIS</span><b>ACCESS CORE</b></div>
  <div class="hud"><video class="vid" id="vid" muted playsinline></video>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="r3" cx="100" cy="100" r="64"/><circle class="r1" cx="100" cy="100" r="94"/><circle class="r2" cx="100" cy="100" r="80"/>
      <g class="lk"><rect x="76" y="98" width="48" height="36" rx="5"/><path class="sh" d="M86 98V86a14 14 0 0 1 28 0v12"/><path d="M100 111v8"/></g>
    </svg>
  </div>
  <div class="st" id="st">TERKUNCI</div>
  <div class="msg" id="msg" role="status" aria-live="polite">Masukkan passcode</div>
  <div class="face" id="face"></div>
  <div class="last" id="last">Memuat status sistem…</div>
  <div class="steps" id="steps"><b>Lama</b><b>Baru</b><b>Ulangi</b></div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="acts"><button class="a" id="chg">Ubah passcode</button><button class="a" id="lockNow" hidden>Kunci sekarang</button><button class="a" id="snd">Suara: nyala</button></div>
  <details id="mng" hidden><summary>Kelola wajah</summary>
  <div class="mrow"><input id="fn" maxlength="40" placeholder="Nama pemilik wajah" aria-label="Nama"><select id="fp" aria-label="Profil"><option>ADMIN</option><option selected>STAF</option><option>TAMU</option></select></div>
  <button class="a" id="reg">Daftarkan wajah</button><div id="fl"></div></details>

  <div class="feed" id="feed"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const P = $('p'), MAXL = 8, MINL = 4, AUTO = 30;
let buf = '', mode = 'enter', tmp = {}, busy = false, sound = true, cd = null, auto = null, ac = null;
const device = () => (navigator.userAgent.slice(0, 110) + ' | ' + screen.width + 'x' + screen.height);

/* ---- API: Apps Script asli, atau mode demo (passcode 123456) jika dibuka langsung di browser ---- */
function api(fn, ...a) {
  if (window.google && google.script && google.script.run)
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a, device()));
  if (GAS_URL) return fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ fn, args: [...a, device()] }) }).then(r => r.json());
  return new Promise(res => setTimeout(() => res(demo[fn](...a)), 350));
}
const demo = { pass: '123456', fails: 0, until: 0, st: 'TERKUNCI',
  getState() { return { status: this.st, waktu: 'mode demo', remaining: 0 } },
  gate() { const l = Math.ceil((this.until - Date.now()) / 1e3); return l > 0 ? { ok: false, locked: true, remaining: l, message: 'Sistem terkunci sementara' } : null },
  bad() { if (++this.fails >= 3) { this.fails = 0; this.until = Date.now() + 15e3; return { ok: false, locked: true, remaining: 15, message: 'Terlalu banyak percobaan salah' } } return { ok: false, left: 3 - this.fails, message: 'Passcode salah' } },
  verifyPasscode(c) { return this.gate() || (c === this.pass ? (this.fails = 0, this.st = 'TERBUKA', { ok: true, message: 'Akses diterima' }) : this.bad()) },
  lockSystem() { this.st = 'TERKUNCI'; return { ok: true } },
  faces: [], ds(a, b) { return Math.hypot(...a.map((x, i) => x - b[i])) },
  verifyFace(d) { const g = this.gate(); if (g) return g; let b = null; this.faces.forEach(f => f.d.forEach(s => { const x = this.ds(d, s); if (!b || x < b.x) b = { x, f }; })); if (b && b.x <= .5) { this.st = 'TERBUKA'; return { ok: true, nama: b.f.nama, profil: b.f.profil, autoLock: { ADMIN: 60, STAF: 30, TAMU: 10 }[b.f.profil] } } return { ok: false, message: 'Wajah tidak dikenal' } },
  registerFace(c, n, p, d) { if (c !== this.pass) return this.bad(); this.faces = this.faces.filter(f => f.nama !== n); this.faces.push({ id: String(Date.now()), nama: n, profil: p, d }); return { ok: true, message: 'Wajah ' + n + ' terdaftar' } },
  listFaces(c) { return c === this.pass ? { ok: true, faces: this.faces } : { ok: false } },
  deleteFace(c, id) { if (c !== this.pass) return this.bad(); this.faces = this.faces.filter(f => f.id !== id); return { ok: true, message: 'Wajah dihapus' } },
  changePasscode(o, n) { if (this.gate()) return this.gate(); if (o !== this.pass) return this.bad(); if (/^(\d)\1+$/.test(n)) return { ok: false, message: 'Passcode terlalu mudah ditebak' }; this.pass = n; return { ok: true, message: 'Passcode berhasil diubah' } } };

/* ---- UI ---- */
const dots = $('dots'); for (let i = 0; i < MAXL; i++) dots.appendChild(document.createElement('span'));
[...'123456789', 'del', '0', 'ok'].forEach(k => {
  const b = document.createElement('button'); b.className = 'k' + (k === 'del' ? ' fn' : k === 'ok' ? ' fn go' : '');
  b.dataset.k = k; b.innerHTML = '<span>' + (k === 'del' ? 'HAPUS' : k === 'ok' ? 'ENTER' : k) + '</span>';
  b.setAttribute('aria-label', k === 'del' ? 'Hapus' : k === 'ok' ? 'Enter' : 'Angka ' + k); $('pad').appendChild(b);
});
function draw() { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < buf.length)); }
function say(t, c) { $('msg').textContent = t; $('msg').className = 'msg ' + (c || ''); }
function feed(t, c) { const d = document.createElement('div'); d.className = c || ''; d.textContent = new Date().toTimeString().slice(0, 8) + '  ' + t; $('feed').prepend(d); while ($('feed').children.length > 4) $('feed').lastChild.remove(); }
function tone(f, d, t) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t || 'square'; o.frequency.value = f; g.gain.setValueAtTime(.05, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d) } catch (e) {} }
const buzz = n => navigator.vibrate && navigator.vibrate(n);
function shake() { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); buzz([60, 40, 60]); tone(140, .35, 'sawtooth') }
function setMode(m) { mode = m; P.dataset.m = m === 'enter' ? 'enter' : 'change'; buf = ''; draw();
  [...$('steps').children].forEach((s, i) => s.classList.toggle('on', i === ['old', 'new', 'confirm'].indexOf(m)));
  $('chg').textContent = m === 'enter' ? 'Ubah passcode' : 'Batal';
  say({ enter: 'Masukkan passcode', old: 'Masukkan passcode lama', new: 'Buat passcode baru (4-8 angka)', confirm: 'Ulangi passcode baru' }[m]); }
function setState(s) { P.dataset.s = s; $('st').textContent = { locked: 'TERKUNCI', open: 'TERBUKA', lockout: 'DIBLOKIR' }[s]; $('lockNow').hidden = s !== 'open'; $('chg').hidden = s === 'open'; }

function startLockout(sec) { setState('lockout'); clearInterval(cd); let t = sec; setMode('enter'); const tick = () => { say('Coba lagi dalam ' + t + ' detik', 'err'); if (t-- <= 0) { clearInterval(cd); setState('locked'); say('Masukkan passcode'); } }; tick(); cd = setInterval(tick, 1000); }
function startAuto(sec) { clearInterval(auto); const N = sec || AUTO; let t = N; $('bar').style.width = '100%'; auto = setInterval(() => { t--; $('bar').style.width = (t / N * 100) + '%'; if (t <= 0) doLock('Kunci otomatis'); }, 1000); }
async function doLock(why) { clearInterval(auto); sessionCode = ''; showMng(false); try { await api('lockSystem') } catch (e) {} setState('locked'); setMode('enter'); say(why || 'Sistem dikunci', ''); feed(why || 'Sistem dikunci', 'in'); tone(300, .25, 'triangle'); }

async function submit() {
  if (busy) return; if (buf.length < MINL) { shake(); say('Minimal ' + MINL + ' angka', 'err'); return; }
  busy = true; P.dataset.busy = 1; const code = buf;
  try {
    if (mode === 'old') { tmp.old = code; setMode('new'); }
    else if (mode === 'new') { tmp.nw = code; setMode('confirm'); }
    else if (mode === 'confirm' && code !== tmp.nw) { shake(); setMode('new'); say('Tidak cocok, buat ulang passcode baru', 'err'); }
    else {
      say('Memverifikasi…');
      const r = mode === 'confirm' ? await api('changePasscode', tmp.old, tmp.nw) : await api('verifyPasscode', code);
      if (r.locked) { shake(); feed(r.message, 'er'); startLockout(r.remaining); }
      else if (!r.ok) { shake(); buf = ''; draw(); say(r.message + (r.left ? ' - sisa ' + r.left + ' percobaan' : ''), 'err'); feed(r.message, 'er'); if (mode === 'confirm') setMode('enter'), say(r.message, 'err'); }
      else if (mode === 'confirm') { tone(880, .12, 'sine'); setMode('enter'); say(r.message, 'ok'); feed('Passcode diubah', 'ok'); tmp = {}; }
      else { setState('open'); setMode('enter'); say('Akses diterima', 'ok'); feed('Akses diterima', 'ok'); tone(660, .1, 'sine'); setTimeout(() => tone(990, .18, 'sine'), 110); buzz(40); startAuto(); sessionCode = code; showMng(true); }
    }
  } catch (e) { say('Gagal terhubung ke server', 'err'); feed('Koneksi gagal', 'er'); }
  busy = false; P.dataset.busy = 0;
}
function press(k) {
  if (busy || P.dataset.s === 'lockout') return;
  if (k === 'ok') return submit();
  if (k === 'del') buf = buf.slice(0, -1); else if (buf.length < MAXL) buf += k; else return;
  draw(); tone(520 + buf.length * 40, .05); buzz(8);
}
$('pad').addEventListener('click', e => { const b = e.target.closest('.k'); if (b) press(b.dataset.k); });
addEventListener('keydown', e => {
  const k = /^\d$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : e.key === 'Enter' ? 'ok' : e.key === 'Escape' ? 'esc' : null; if (!k) return;
  if (k === 'esc') { buf = ''; draw(); return; }
  const el = document.querySelector('.k[data-k="' + k + '"]'); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 110); } press(k);
});
$('chg').onclick = () => { if (P.dataset.s === 'lockout') return; setMode(mode === 'enter' ? 'old' : 'enter'); tmp = {}; };
$('lockNow').onclick = () => doLock('Sistem dikunci');
$('snd').onclick = () => { sound = !sound; $('snd').textContent = 'Suara: ' + (sound ? 'nyala' : 'mati'); };

/* ---- FACE ID (face-api.js) ---- */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyj4QbONG3ElTuj0na-JNDrayONRQk1kdFwQOynWzW-nxiuZotM3GPc7DDxGkqyZ6rJ/exec';   // isi URL web app (/exec) HANYA jika Index.html di-host di luar Apps Script
const MODELS = 'https://justadudewhohacks.github.io/face-api.js/models', LIVE = true;  // LIVE: wajib kedip (anti foto)
const vid = $('vid'), sleep = ms => new Promise(r => setTimeout(r, ms)), rnd = d => Array.from(d, x => +x.toFixed(4));
let camOn = false, modelsOk = false, regBusy = false, sessionCode = '', blink = {}, cool = 0;
const opt = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: .5 });
const ear = p => (Math.hypot(p[1].x - p[5].x, p[1].y - p[5].y) + Math.hypot(p[2].x - p[4].x, p[2].y - p[4].y)) / (2 * Math.hypot(p[0].x - p[3].x, p[0].y - p[3].y));
function faceMsg(t, c) { const f = $('face'); f.textContent = t; f.style.color = c === 'er' ? 'var(--red)' : c === 'ok' ? 'var(--grn)' : ''; }
function showMng(v) { $('mng').hidden = !v; if (v) refreshFaces(); else { $('mng').open = false; P.dataset.reg = 0; } }
$('mng').addEventListener('toggle', () => { P.dataset.reg = $('mng').open ? 1 : 0; });

async function startCam() {
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }, audio: false });
    await vid.play(); camOn = true; P.dataset.cam = 1; feed('Kamera aktif', 'ok');
  } catch (e) { faceMsg('Kamera tidak aktif - gunakan passcode', 'er'); feed('Kamera ditolak / tidak tersedia', 'er'); return; }
  try {
    faceMsg('Memuat model wajah…');
    await Promise.all([faceapi.nets.tinyFaceDetector, faceapi.nets.faceLandmark68Net, faceapi.nets.faceRecognitionNet].map(n => n.loadFromUri(MODELS)));
    modelsOk = true; faceMsg('Hadapkan wajah ke kamera'); scan();
  } catch (e) { faceMsg('Model wajah gagal dimuat - gunakan passcode', 'er'); }
}

async function scan() {
  const next = ms => setTimeout(scan, ms || 300);
  if (busy || regBusy || P.dataset.s !== 'locked' || Date.now() < cool) return next(500);
  try {
    const d = await faceapi.detectSingleFace(vid, opt()).withFaceLandmarks();
    if (!d) { blink = {}; faceMsg('Hadapkan wajah ke kamera'); return next(); }
    if (LIVE && !blink.done) {
      const e = (ear(d.landmarks.getLeftEye()) + ear(d.landmarks.getRightEye())) / 2;
      if (e < .2) blink.closed = true; else if (blink.closed && e > .25) blink.done = true;
      if (!blink.done) { faceMsg('Kedipkan mata untuk verifikasi'); return next(120); }
    }
    busy = true; P.dataset.busy = 1; faceMsg('Memverifikasi wajah…');
    const f = await faceapi.detectSingleFace(vid, opt()).withFaceLandmarks().withFaceDescriptor();
    blink = {};
    const r = f ? await api('verifyFace', rnd(f.descriptor)) : { ok: false, message: 'Wajah kurang jelas' };
    busy = false; P.dataset.busy = 0;
    if (r.locked) { shake(); faceMsg(r.message, 'er'); startLockout(r.remaining); }
    else if (!r.ok) { cool = Date.now() + 5000; shake(); faceMsg(r.message + ' - akses ditolak', 'er'); feed(r.message, 'er'); }
    else {
      sessionCode = ''; showMng(false); setState('open'); setMode('enter'); say('Halo, ' + r.nama, 'ok');
      faceMsg('Profil: ' + r.profil + ' · kunci otomatis ' + r.autoLock + ' dtk', 'ok'); feed(r.nama + ' (' + r.profil + ')', 'ok');
      tone(660, .1, 'sine'); setTimeout(() => tone(990, .18, 'sine'), 110); buzz(40); startAuto(r.autoLock);
    }
  } catch (e) { busy = false; P.dataset.busy = 0; }
  next();
}

async function register() {
  const nama = $('fn').value.trim();
  if (!nama) return say('Isi nama dulu', 'err');
  if (!camOn || !modelsOk) return say('Kamera atau model belum siap', 'err');
  startAuto(90); regBusy = true; const ds = []; let n = 0;
  while (ds.length < 4 && n++ < 40) {
    const f = await faceapi.detectSingleFace(vid, opt()).withFaceLandmarks().withFaceDescriptor();
    if (f) { ds.push(rnd(f.descriptor)); faceMsg('Sampel ' + ds.length + '/4 - gerakkan kepala sedikit'); tone(700, .06); } else faceMsg('Wajah belum terdeteksi…');
    await sleep(700);
  }
  regBusy = false;
  if (ds.length < 4) return say('Wajah tidak terdeteksi, coba lagi', 'err');
  const r = await api('registerFace', sessionCode, nama, $('fp').value, ds);
  say(r.message, r.ok ? 'ok' : 'err'); feed(r.message, r.ok ? 'ok' : 'er'); faceMsg(r.ok ? 'Wajah terdaftar' : '', 'ok');
  if (r.ok) { $('fn').value = ''; refreshFaces(); } else if (r.locked) { clearInterval(auto); startLockout(r.remaining); showMng(false); }
}

async function refreshFaces() {
  try {
    const r = await api('listFaces', sessionCode), box = $('fl'); box.textContent = '';
    if (!r.ok) return;
    if (!r.faces.length) box.textContent = 'Belum ada wajah terdaftar';
    r.faces.forEach(f => {
      const d = document.createElement('div'), s = document.createElement('span'), b = document.createElement('button');
      s.textContent = f.nama + ' · ' + f.profil; b.className = 'a'; b.textContent = 'Hapus';
      b.onclick = async () => { startAuto(60); const x = await api('deleteFace', sessionCode, f.id); feed(x.message || 'Gagal', x.ok ? 'ok' : 'er'); refreshFaces(); };
      d.append(s, b); box.append(d);
    });
  } catch (e) {}
}
$('reg').onclick = register;

(async function init() {
  try {
    const s = await api('getState');
    $('last').textContent = 'Status terakhir: ' + s.status + ' · ' + s.waktu;
    feed('Terhubung ke database', 'in'); if (s.remaining > 0) startLockout(s.remaining);
  } catch (e) { $('last').textContent = 'Database tidak terjangkau'; feed('Koneksi gagal', 'er'); }
  if (!(window.google && google.script && google.script.run) && !GAS_URL) feed('Mode demo - passcode 123456', 'in');
  startCam();
})();
</script>
